<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Moving Point</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #elapsed-time {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div id="elapsed-time">Elapsed Time: 0.00s</div>
    <script type="module" src="main_v2.js"></script>
</body>
</html>
