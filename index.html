<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Moving Point</title>
    <style>
        body {
            margin: 0;
        }

        canvas {
            display: block;
        }

        #elapsed-time, #buttons {
            position: absolute;
            display: flex;
            top: 10px;
            left: 10px;
            font-size: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 3px;
        }

        #buttons {
            right: 0px;
            left: 0px;
        }


        .lil-gui * {
            font-size: 18px !important;
            /* Bigger text */
        }

        .lil-gui.root {
            width: 400px !important;
            /* Wider panel */
        }
    </style>
</head>

<body>
    <div id="elapsed-time">
        <p>Elapsed Time: 0.00s</p>
        <p>Leader coords: (x: 0, y:0, z:0)</p>
    </div>

    <div id="buttons">
        <button id="toggle-leader">LEADER</button>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
